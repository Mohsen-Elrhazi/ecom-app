server:
  port: 8081

spring:
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/ecom-app
          jwk-set-uri: http://localhost:8085/realms/ecom-app/protocol/openid-connect/certs

  datasource:
    url: jdbc:mysql://localhost:3307/user_db
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: user
    password: user123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    generate-ddl: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

jwt:
  auth:
    converter:
      resource-id: ecom-app-web
      principle-attribute: preferred_username