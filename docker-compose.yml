services:

  keycloak-mysql:
    image: mysql:8.4
    container_name: ecom-keycloak-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: keycloak123

    ports:
      - "3308:3306"

    volumes:
      - keycloak_mysql_data:/var/lib/mysql

    networks:
      - ecom-network


  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: ecom-keycloak
    restart: unless-stopped

    command: start-dev

    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://keycloak-mysql:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123

    ports:
      - "8085:8080"

    depends_on:
      - keycloak-mysql

    networks:
      - ecom-network


  keycloak-phpmyadmin:
    image: phpmyadmin:latest
    container_name: ecom-keycloak-phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: keycloak-mysql
      PMA_PORT: 3306

    ports:
      - "8083:80"

    depends_on:
      - keycloak-mysql

    networks:
      - ecom-network


volumes:
  keycloak_mysql_data:


networks:
  ecom-network:
    driver: bridge